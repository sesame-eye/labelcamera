<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>カメラ枠表示（iOS標準OCR対応）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #000; color: #fff; overflow: hidden; text-align: center; }
        
        #container {
            position: relative;
            width: 100vw;
            height: 60vh;
            background: #222;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 枠線全体を80%に縮小（はみ出し防止） */
        #overlay-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 100%;
            max-width: 600px;
            aspect-ratio: 3 / 2;
            pointer-events: none;
        }

        .box {
            position: absolute;
            border: 4px solid #FFD700; /* 初期状態：黄色 */
            border-radius: 4px;
            transition: border-color 0.2s;
        }
        
        /* 枠をタップするか、入力欄にフォーカスが当たった時に赤くする（CSSで制御） */
        .box.active {
            border-color: #FF3B30;
            background-color: rgba(255, 59, 48, 0.1);
        }

        /* 枠の位置（ご提示の画像比率） */
        #box1 { top: 5%;   left: 7%;   width: 86%;  height: 35%; }
        #box2 { top: 44%;  left: 17%;  width: 23%;  height: 14%; }
        #box3 { top: 45%;  left: 62%;  width: 22%;  height: 14%; }
        #box4 { top: 62%;  left: 46%;  width: 50%;  height: 15%; }
        #box5 { top: 78%;  left: 55%;  width: 22%;  height: 14%; }

        /* 結果＆入力エリア */
        #result-area {
            height: 40vh;
            padding: 12px;
            background: #111;
            overflow-y: auto;
            border-top: 2px solid #333;
            text-align: left;
        }
        #status { color: #007AFF; font-weight: bold; margin-bottom: 10px; text-align: center; font-size: 14px; }

        .result-line {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .result-line label {
            width: 50px;
            font-weight: bold;
            color: #FFD700;
            font-size: 14px;
        }
        /* iOSの標準OCR（テキストをスキャン）を確実に反応させる属性を付与 */
        .result-line input {
            flex: 1;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 16px; /* 16px未満だとiOSでズームしてしまうのを防ぐ */
        }
        .result-line input:focus {
            border-color: #FF3B30;
            outline: none;
            background: #333;
        }
    </style>
</head>
<body>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <div id="overlay-wrapper">
            <div id="box1" class="box"></div>
            <div id="box2" class="box"></div>
            <div id="box3" class="box"></div>
            <div id="box4" class="box"></div>
            <div id="box5" class="box"></div>
        </div>
    </div>

    <div id="result-area">
        <div id="status">枠に合わせて下の入力欄をタップ ➔「テキストをスキャン」</div>
        <div class="result-line"><label>枠1:</label><input type="text" id="text-box1" placeholder="ここをタップしてスキャン"></div>
        <div class="result-line"><label>枠2:</label><input type="text" id="text-box2" placeholder="ここをタップしてスキャン"></div>
        <div class="result-line"><label>枠3:</label><input type="text" id="text-box3" placeholder="ここをタップしてスキャン"></div>
        <div class="result-line"><label>枠4:</label><input type="text" id="text-box4" placeholder="ここをタップしてスキャン"></div>
        <div class="result-line"><label>枠5:</label><input type="text" id="text-box5" placeholder="ここをタップしてスキャン"></div>
    </div>

    <script>
        const video = document.getElementById('video');

        // 1. 起動と同時にカメラ映像だけを最速で開始（エラーの起きるOCR処理は一切なし）
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                document.getElementById('status').innerText = "カメラの起動に失敗しました。Safariの権限を確認してください。";
            }
        }

        // 2. どの入力欄が選択されているかに応じて、画面上の枠線の色を「黄色 ➔ 赤（active）」に切り替える
        const inputs = [
            { input: document.getElementById('text-box1'), box: document.getElementById('box1') },
            { input: document.getElementById('text-box2'), box: document.getElementById('box2') },
            { input: document.getElementById('text-box3'), box: document.getElementById('box3') },
            { input: document.getElementById('text-box4'), box: document.getElementById('box4') },
            { input: document.getElementById('text-box5'), box: document.getElementById('box5') }
        ];

        inputs.forEach(item => {
            // 入力欄がタップされたら対応する枠を赤にする
            item.input.addEventListener('focus', () => {
                inputs.forEach(i => i.box.classList.remove('active')); // 一旦全部リセット
                item.box.classList.add('active');
            });
            item.input.addEventListener('blur', () => {
                // 入力欄から外れたら黄に戻す
                setTimeout(() => { item.box.classList.remove('active'); }, 200);
            });
        });

        window.addEventListener('load', startCamera);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OCR カメラ枠読み取り</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #000; color: #fff; overflow: hidden; text-align: center; }
        
        #container {
            position: relative;
            width: 100vw;
            height: 70vh;
            background: #222;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #overlay-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 600px;
            aspect-ratio: 3 / 2;
            pointer-events: none;
        }

        .box {
            position: absolute;
            border: 4px solid #FFD700;
            border-radius: 4px;
            transition: border-color 0.2s;
        }
        .box.detected {
            border-color: #FF3B30;
        }

        /* 枠の位置微調整 */
        #box1 { top: 5%;   left: 7%;   width: 86%;  height: 35%; }
        #box2 { top: 44%;  left: 17%;  width: 23%;  height: 14%; }
        #box3 { top: 45%;  left: 62%;  width: 22%;  height: 14%; }
        #box4 { top: 62%;  left: 46%;  width: 50%;  height: 15%; }
        #box5 { top: 78%;  left: 55%;  width: 22%;  height: 14%; }

        #result-area {
            height: 30vh;
            padding: 15px;
            background: #111;
            overflow-y: auto;
            border-top: 2px solid #333;
            text-align: left;
        }
        .result-line { margin-bottom: 5px; font-size: 14px; }
        .result-line span { font-weight: bold; color: #FFD700; }
        #status { color: #aaa; font-style: italic; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <div id="overlay-wrapper">
            <div id="box1" class="box"></div>
            <div id="box2" class="box"></div>
            <div id="box3" class="box"></div>
            <div id="box4" class="box"></div>
            <div id="box5" class="box"></div>
        </div>
    </div>

    <div id="result-area">
        <div id="status">OCRライブラリ初期化中...</div>
        <div class="result-line"><span>枠1:</span> <span id="text-box1">---</span></div>
        <div class="result-line"><span>枠2:</span> <span id="text-box2">---</span></div>
        <div class="result-line"><span>枠3:</span> <span id="text-box3">---</span></div>
        <div class="result-line"><span>枠4:</span> <span id="text-box4">---</span></div>
        <div class="result-line"><span>枠5:</span> <span id="text-box5">---</span></div>
    </div>

    <canvas id="crop-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');
        
        // 枠1用(日本語+英語)と、他の枠用(数字専用)の2つのワーカーを用意して速度と精度を両立
        let workerAll = null;
        let workerNum = null;
        let isProcessing = false;

        async function initOCR() {
            try {
                statusEl.innerText = "OCRエンジン初期化中(1/2)...";
                // 全文字用ワーカー (枠1用)
                workerAll = await Tesseract.createWorker('jpn+eng');
                
                statusEl.innerText = "OCRエンジン初期化中(2/2)...";
                // 数字専用ワーカー (枠2〜5用)
                workerNum = await Tesseract.createWorker('eng');
                // 枠2〜5は半角数字以外を完全に無視する設定
                await workerNum.setParameters({
                    tessedit_char_whitelist: '0123456789'
                });

                statusEl.innerText = "カメラ起動中...";
                startCamera();
            } catch (err) {
                statusEl.style.color = "#FF3B30";
                statusEl.innerText = "初期化エラー: " + err.message;
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                statusEl.style.color = "#aaa";
                statusEl.innerText = "スキャン中... 枠内に文字を合わせてください";
                
                // 解析サイクルを1秒ごとに設定
                setInterval(captureAndRecognize, 1000);
            } catch (err) {
                statusEl.style.color = "#FF3B30";
                statusEl.innerText = "カメラ起動エラー: " + err.message;
            }
        }

        async function captureAndRecognize() {
            if (isProcessing || !workerAll || !workerNum || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            isProcessing = true;

            const canvas = document.getElementById('crop-canvas');
            const ctx = canvas.getContext('2d');

            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;
            const videoRect = video.getBoundingClientRect();

            for (let i = 1; i <= 5; i++) {
                const boxEl = document.getElementById(`box${i}`);
                const boxRect = boxEl.getBoundingClientRect();

                const scaleX = vWidth / videoRect.width;
                const scaleY = vHeight / videoRect.height;

                const cropX = (boxRect.left - videoRect.left) * scaleX;
                const cropY = (boxRect.top - videoRect.top) * scaleY;
                const cropW = boxRect.width * scaleX;
                const cropH = boxRect.height * scaleY;

                if (cropW <= 0 || cropH <= 0) continue;

                canvas.width = cropW;
                canvas.height = cropH;
                
                // 画像のコントラストを少し上げて文字をクッキリさせる（精度向上対策）
                ctx.filter = 'contrast(1.3) brightness(0.9)';
                ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
                ctx.filter = 'none'; // 元に戻す

                try {
                    // 枠1とそれ以外で使うエンジンを切り替える
                    const activeWorker = (i === 1) ? workerAll : workerNum;
                    const { data: { text } } = await activeWorker.recognize(canvas);
                    
                    // 改行や前後の余白をキレイに掃除
                    const cleanedText = text.trim().replace(/\n/g, '');

                    if (cleanedText.length > 0) {
                        boxEl.classList.add('detected');
                        document.getElementById(`text-box${i}`).innerText = cleanedText;
                    } else {
                        boxEl.classList.remove('detected');
                    }
                } catch (ocrErr) {
                    console.error("OCR Error:", ocrErr);
                }
            }

            isProcessing = false;
        }

        window.addEventListener('load', initOCR);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>OCR カメラ枠読み取り</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #000; color: #fff; overflow: hidden; text-align: center; }
        
        #container {
            position: relative;
            width: 100vw;
            height: 65vh;
            background: #222;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 枠線オーバーレイ：全体を80%に縮小（20%小さく） */
        #overlay-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 100%;
            max-width: 600px;
            aspect-ratio: 3 / 2;
            pointer-events: none;
        }

        .box {
            position: absolute;
            border: 4px solid #FFD700;
            border-radius: 4px;
            transition: border-color 0.2s, background-color 0.2s;
        }
        /* 文字を検知したら赤枠にし、ほんのり半透明の赤背景にする */
        .box.detected {
            border-color: #FF3B30;
            background-color: rgba(255, 59, 48, 0.15);
        }

        /* 枠の位置（比率） */
        #box1 { top: 5%;   left: 7%;   width: 86%;  height: 35%; }
        #box2 { top: 44%;  left: 17%;  width: 23%;  height: 14%; }
        #box3 { top: 45%;  left: 62%;  width: 22%;  height: 14%; }
        #box4 { top: 62%;  left: 46%;  width: 50%;  height: 15%; }
        #box5 { top: 78%;  left: 55%;  width: 22%;  height: 14%; }

        /* 結果＆入力エリア */
        #result-area {
            height: 35vh;
            padding: 12px;
            background: #111;
            overflow-y: auto;
            border-top: 2px solid #333;
            text-align: left;
        }
        #status { color: #aaa; font-style: italic; margin-bottom: 8px; text-align: center; font-size: 13px; }

        /* 各入力行のスタイル */
        .result-line {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .result-line label {
            width: 50px;
            font-weight: bold;
            color: #FFD700;
            font-size: 14px;
        }
        /* iPhoneの標準OCR（テキストをスキャン）を呼び出すためのインプット欄 */
        .result-line input {
            flex: 1;
            padding: 6px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 15px;
        }
        .result-line input:focus {
            border-color: #007AFF;
            outline: none;
        }

        /* 読み取るボタンのエリア */
        #btn-container {
            position: absolute;
            bottom: 37vh;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }
        /* 初期状態は非表示、文字を検知したら浮かび上がる */
        .scan-trigger-btn {
            pointer-events: auto;
            background: #FF3B30;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            animate: pulse 1.5s infinite;
        }
    </style>
</head>
<body>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <div id="overlay-wrapper">
            <div id="box1" class="box"></div>
            <div id="box2" class="box"></div>
            <div id="box3" class="box"></div>
            <div id="box4" class="box"></div>
            <div id="box5" class="box"></div>
        </div>
    </div>

    <div id="btn-container">
        <button id="scan-btn" class="scan-trigger-btn">ここをタップして超高精度スキャン</button>
    </div>

    <div id="result-area">
        <div id="status">OCRエンジン初期化中...</div>
        <div class="result-line"><label>枠1:</label><input type="text" id="text-box1" placeholder="タップしてスキャン可能"></div>
        <div class="result-line"><label>枠2:</label><input type="text" id="text-box2" placeholder="タップしてスキャン可能"></div>
        <div class="result-line"><label>枠3:</label><input type="text" id="text-box3" placeholder="タップしてスキャン可能"></div>
        <div class="result-line"><label>枠4:</label><input type="text" id="text-box4" placeholder="タップしてスキャン可能"></div>
        <div class="result-line"><label>枠5:</label><input type="text" id="text-box5" placeholder="タップしてスキャン可能"></div>
    </div>

    <canvas id="crop-canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');
        const scanBtn = document.getElementById('scan-btn');
        
        let workerAll = null;
        let workerNum = null;
        let isProcessing = false;

        async function initOCR() {
            try {
                statusEl.innerText = "センサー初期化中...";
                workerAll = await Tesseract.createWorker('jpn+eng');
                workerNum = await Tesseract.createWorker('eng');
                await workerNum.setParameters({ tessedit_char_whitelist: '0123456789' });

                statusEl.innerText = "カメラ連動中...";
                startCamera();
            } catch (err) {
                statusEl.innerText = "初期化エラー: " + err.message;
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                video.srcObject = stream;
                statusEl.innerText = "自動枠合わせ中... 文字が入ると赤枠になります";
                
                // 1秒ごとに簡易チェック（ロック検知用）
                setInterval(captureAndRecognize, 1000);
            } catch (err) {
                statusEl.innerText = "カメラ接続エラー";
            }
        }

        async function captureAndRecognize() {
            if (isProcessing || !workerAll || !workerNum || video.readyState !== video.HAVE_ENOUGH_DATA) return;
            isProcessing = true;

            const canvas = document.getElementById('crop-canvas');
            const ctx = canvas.getContext('2d');
            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;
            const videoRect = video.getBoundingClientRect();

            let anyDetected = false;

            for (let i = 1; i <= 5; i++) {
                const boxEl = document.getElementById(`box${i}`);
                const boxRect = boxEl.getBoundingClientRect();

                const scaleX = vWidth / videoRect.width;
                const scaleY = vHeight / videoRect.height;

                const cropX = (boxRect.left - videoRect.left) * scaleX;
                const cropY = (boxRect.top - videoRect.top) * scaleY;
                const cropW = boxRect.width * scaleX;
                const cropH = boxRect.height * scaleY;

                if (cropW <= 0 || cropH <= 0) continue;

                canvas.width = cropW;
                canvas.height = cropH;
                ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                try {
                    const activeWorker = (i === 1) ? workerAll : workerNum;
                    const { data: { text } } = await activeWorker.recognize(canvas);
                    const cleanedText = text.trim();

                    if (cleanedText.length > 0) {
                        boxEl.classList.add('detected');
                        anyDetected = true;
                        
                        // 途中で大枠だけ仮入力
                        if(!document.getElementById(`text-box${i}`).value) {
                            document.getElementById(`text-box${i}`).value = cleanedText;
                        }
                    } else {
                        boxEl.classList.remove('detected');
                    }
                } catch (e) {}
            }

            // いずれかの枠に文字が入り、赤枠になったら「読み取る」ボタンを表示
            if (anyDetected) {
                scanBtn.style.display = "block";
            } else {
                scanBtn.style.display = "none";
            }

            isProcessing = false;
        }

        // 🔥 【今回の核心】ボタンを押した際、iPhone標準の最強OCR入力を立ち上げる
        scanBtn.addEventListener('click', () => {
            // ユーザーが一番最初に入力させたい「枠1」のインプット欄にフォーカスを当てる
            const targetInput = document.getElementById('text-box1');
            targetInput.focus();
            
            // 案内メッセージを更新
            statusEl.innerText = "キーボード上の【カメラマーク】または【テキストをスキャン】を押してください";
            statusEl.style.color = "#007AFF";
        });
    </script>
</body>
</html>
